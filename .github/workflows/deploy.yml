name: 🚀 UtilPro Full Auto Pipeline

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC
  workflow_dispatch:

jobs:
  seo-ping:
    name: 🔍 SEO Pings
    runs-on: ubuntu-latest
    steps:
      - name: ⏳ Wait for Netlify/Vercel deploy
        run: sleep 90

      - name: 📡 Ping Google
        run: curl -s "https://www.google.com/ping?sitemap=https://utilpro.netlify.app/sitemap.xml" || true

      - name: 📡 Ping Bing
        run: curl -s "https://www.bing.com/ping?sitemap=https://utilpro.netlify.app/sitemap.xml" || true

      - name: 📡 IndexNow - Netlify
        run: |
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json" \
            -d '{"host":"utilpro.netlify.app","key":"utilpro2026seoaeo","urlList":["https://utilpro.netlify.app/","https://utilpro.netlify.app/tools/pdf-tools.html","https://utilpro.netlify.app/tools/emi-calculator.html","https://utilpro.netlify.app/tools/age-calculator.html","https://utilpro.netlify.app/blog/"]}' || true
          echo "✅ IndexNow pinged"

      - name: 📡 IndexNow - Vercel
        run: |
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json" \
            -d '{"host":"utilpro.vercel.app","key":"utilpro2026seoaeo","urlList":["https://utilpro.vercel.app/","https://utilpro.vercel.app/tools/pdf-tools.html","https://utilpro.vercel.app/tools/emi-calculator.html"]}' || true

  health-check:
    name: ✅ Health Check
    runs-on: ubuntu-latest
    needs: seo-ping
    steps:
      - name: Check Netlify
        run: |
          S=$(curl -s -o /dev/null -w "%{http_code}" https://utilpro.netlify.app/)
          echo "Netlify: $S"; [ "$S" = "200" ] && echo "✅ OK" || echo "⚠️ Issue: $S"

      - name: Check Vercel
        run: |
          S=$(curl -s -o /dev/null -w "%{http_code}" https://utilpro.vercel.app/)
          echo "Vercel: $S"; [ "$S" = "200" ] && echo "✅ OK" || echo "⚠️ Issue: $S"

      - name: Check PDF Tools
        run: |
          S=$(curl -s -o /dev/null -w "%{http_code}" https://utilpro.netlify.app/tools/pdf-tools.html)
          echo "PDF Tools: $S"; [ "$S" = "200" ] && echo "✅ OK" || echo "⚠️ $S"

      - name: Check Sitemap
        run: |
          S=$(curl -s -o /dev/null -w "%{http_code}" https://utilpro.netlify.app/sitemap.xml)
          echo "Sitemap: $S"; [ "$S" = "200" ] && echo "✅ OK" || echo "⚠️ $S"

      - name: Check Admin
        run: |
          S=$(curl -s -o /dev/null -w "%{http_code}" https://utilpro.netlify.app/admin.html)
          echo "Admin: $S"; [ "$S" = "200" ] && echo "✅ OK" || echo "⚠️ $S"

      - name: ✅ Pipeline Complete
        run: |
          echo "================================================"
          echo "  ✅ UtilPro Auto Pipeline Complete!"
          echo "  🌐 Netlify  : utilpro.netlify.app"
          echo "  🔺 Vercel   : utilpro.vercel.app"
          echo "  📊 GA4      : G-X52KR4FG9X active"
          echo "  💰 AdSense  : ca-pub-3332637557301277"
          echo "  🔍 SEO pings: Google + Bing + IndexNow"
          echo "================================================"
